<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICKLE.LAB ｜ 匹克球數位教材</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070D; --graphite:#11161F; --ink:#F0F5FA; --muted:#AEBCCB; --faint:#8798A8;
  --blue:#3B7BFF; --cyan:#2DD4E8; --violet:#8B7BFF;
  --glass:rgba(255,255,255,.04); --glass2:rgba(255,255,255,.065); --edge:rgba(255,255,255,.12);
  --edge2:rgba(255,255,255,.2);
  --good:#3FD69C; --bad:#FF6B81; --r:14px;
  --display:"Space Grotesk","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.8;font-size:16.5px;background:var(--bg);overflow-x:hidden}
img,svg{max-width:100%}
a{color:var(--cyan);text-decoration:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg .grid{position:absolute;inset:-20%;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
  background-size:68px 68px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 10%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 10%,transparent 75%);
  animation:drift 90s linear infinite}
@keyframes drift{to{transform:translate3d(68px,68px,0)}}
.bg .orb{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5}
.orb.a{width:620px;height:620px;top:-220px;right:-140px;background:radial-gradient(circle,rgba(59,123,255,.42),transparent 70%);animation:float 34s ease-in-out infinite}
.orb.b{width:520px;height:520px;top:46%;left:-200px;background:radial-gradient(circle,rgba(139,123,255,.3),transparent 70%);animation:float 46s ease-in-out infinite reverse}
.orb.c{width:460px;height:460px;bottom:-160px;right:10%;background:radial-gradient(circle,rgba(45,212,232,.2),transparent 70%);animation:float 58s ease-in-out infinite}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,50px)}}
canvas#dust{position:absolute;inset:0;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.bg .grid,.orb{animation:none}canvas#dust{display:none}}

header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
.navin{margin:14px auto 0;max-width:1160px;width:calc(100% - 32px);display:flex;align-items:center;gap:18px;
  padding:11px 14px 11px 22px;border:1px solid var(--edge);border-radius:999px;
  background:rgba(8,12,20,.66);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.06em;font-size:18px;color:var(--ink);flex:none}
.logo svg{width:22px;height:22px;flex:none}
.navlinks{display:flex;gap:3px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlinks button{flex:none;font:inherit;background:none;border:0;color:var(--muted);font-size:16.5px;font-weight:500;
  padding:9px 17px;border-radius:999px;cursor:pointer;transition:color .25s,background .25s;white-space:nowrap}
.navlinks button:hover,.navlinks button.active{color:var(--ink);background:var(--glass2)}
.langsw{flex:none;display:flex;gap:2px;border:1px solid var(--edge);border-radius:999px;padding:3px;background:var(--glass)}
.langsw button{font:inherit;font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.05em;border:0;background:none;
  color:var(--faint);padding:6px 13px;border-radius:999px;cursor:pointer;transition:.25s}
.langsw button.on{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff}

.btn{position:relative;display:inline-flex;align-items:center;gap:10px;font-family:var(--body);font-weight:500;font-size:15.5px;
  padding:13px 26px;border-radius:999px;border:1px solid transparent;cursor:pointer;overflow:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),box-shadow .3s}
.btn svg{width:17px;height:17px;flex:none}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transition:left .7s ease}
.btn:hover::after{left:130%}
.btn-primary{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff;box-shadow:0 8px 26px -10px rgba(59,123,255,.9)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px rgba(59,123,255,1)}
.btn-ghost{background:var(--glass);color:var(--ink);border-color:var(--edge)}
.btn-ghost:hover{transform:translateY(-2px);border-color:var(--edge2);background:var(--glass2)}

.panel{display:none}
.panel.on{display:block;animation:pgin .5s cubic-bezier(.2,.8,.3,1)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}
.pagetop{padding:30px 0 0}
.backlink{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:15px;color:var(--muted);
  border:1px solid var(--edge);background:var(--glass);border-radius:999px;padding:9px 18px;cursor:pointer;transition:.28s}
.backlink:hover{color:var(--ink);border-color:var(--edge2);background:var(--glass2)}
.backlink svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pagenav{display:flex;gap:10px;justify-content:space-between;margin:50px 0 10px;padding-top:26px;border-top:1px solid var(--edge)}
.pagenav button{font:inherit;font-size:15px;color:var(--muted);background:var(--glass);border:1px solid var(--edge);
  border-radius:999px;padding:10px 20px;cursor:pointer;transition:.28s}
.pagenav button:hover{color:var(--ink);border-color:var(--edge2);background:var(--glass2)}

.hero{padding:76px 0 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.tagline{display:inline-flex;align-items:center;gap:9px;font-family:var(--display);font-size:12.5px;letter-spacing:.14em;color:var(--cyan);
  border:1px solid rgba(45,212,232,.3);background:rgba(45,212,232,.07);padding:6px 15px;border-radius:999px;margin-bottom:26px}
.tagline i{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tagline i,.scanline{animation:none}}
h1{font-weight:900;font-size:clamp(36px,5.4vw,58px);line-height:1.14;letter-spacing:-.01em;margin:0 0 20px}
h1 span{background:linear-gradient(100deg,#fff 20%,var(--cyan) 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:18px;line-height:1.8;max-width:48ch;margin:0 0 34px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.credit{margin:28px 0 0;font-size:14px;color:var(--faint);display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--edge);border-radius:999px;padding:9px 20px;background:var(--glass)}
.credit b{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.visual{position:relative;border:1px solid var(--edge);border-radius:22px;padding:22px;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 30px 70px -40px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.08)}
.visual svg{display:block;width:100%;height:auto}
.scanline{animation:scan 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}8%{opacity:.85}50%{transform:translateY(200px);opacity:.85}58%{opacity:0}}
.vlabel{position:absolute;font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--faint)}
.vlabel.tl{top:14px;left:20px}
.vlabel.br{bottom:14px;right:20px}

section{padding:34px 0 74px}
.shead{margin-bottom:38px;max-width:64ch}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--cyan);display:block;margin-bottom:12px}
h2{font-weight:700;font-size:clamp(26px,3.2vw,36px);line-height:1.25;margin:0 0 12px;letter-spacing:-.01em}
.shead p{color:var(--muted);margin:0;font-size:16px}
h3{font-weight:700;font-size:19px;margin:0 0 8px}
.glass{border:1px solid var(--edge);border-radius:var(--r);
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.feat{padding:28px 24px 26px;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s,border-color .35s;display:block;color:inherit;cursor:pointer;text-align:left;font:inherit}
.feat:hover{transform:translateY(-6px);border-color:rgba(59,123,255,.45);
  box-shadow:0 22px 50px -28px rgba(59,123,255,.85),inset 0 1px 0 rgba(255,255,255,.1)}
.feat .ico{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--edge);
  background:rgba(59,123,255,.1);margin-bottom:18px}
.feat .ico svg{width:20px;height:20px;stroke:var(--cyan);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.feat p{color:var(--muted);font-size:15.5px;margin:0;line-height:1.7}
.feat .go{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--cyan);opacity:.75;margin-top:16px;display:block}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--edge);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.stat{background:rgba(8,12,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:32px 26px;text-align:center}
.stat .n{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;
  background:linear-gradient(140deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .u{font-size:14.5px;color:var(--muted);margin-top:10px}

.courtbox{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:26px;align-items:start}
.courtsvg{padding:18px;border-radius:var(--r);border:1px solid var(--edge);background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01))}
.courtsvg svg{display:block;width:100%;height:auto}
.zone{cursor:pointer;transition:opacity .25s}
.zone:hover{opacity:.72}
.zone.sel{opacity:.6}
.zoneinfo{padding:26px;min-height:240px}
.zoneinfo .big{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:6px 0 14px;
  background:linear-gradient(140deg,#fff,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.zoneinfo p{margin:0 0 11px;font-size:15.5px;line-height:1.8;color:var(--muted)}
.hint{font-size:14.5px;color:var(--faint)}

.eqgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px;margin-top:22px}
.eq{padding:26px 24px;transition:transform .35s cubic-bezier(.2,.8,.3,1),box-shadow .35s,border-color .35s}
.eq:hover{transform:translateY(-5px);border-color:rgba(45,212,232,.34);box-shadow:0 20px 46px -28px rgba(45,212,232,.7)}
.eq p{font-size:15.5px;color:var(--muted);margin:0;line-height:1.75}
.eq dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:14px 0 0;font-size:14.5px}
.eq dt{color:var(--cyan);opacity:.85;white-space:nowrap}
.eq dd{margin:0;color:var(--ink)}
.spec{font-family:var(--display);font-weight:600;color:var(--cyan)}

.skilllayout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;align-items:start}
.skilllist{display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
.skilllist button{font:inherit;font-weight:400;text-align:left;background:transparent;border:1px solid transparent;padding:10px 15px;
  color:var(--muted);cursor:pointer;border-radius:10px;transition:.25s;font-size:15.5px}
.skilllist button:hover{color:var(--ink);background:var(--glass)}
.skilllist button[aria-current="true"]{color:var(--ink);font-weight:500;background:var(--glass2);border-color:var(--edge)}
.skillcard{padding:30px}
.skillcard h3{font-size:25px;margin-bottom:10px}
.purpose{font-size:17px;color:var(--muted);margin:0 0 24px;line-height:1.8}
.diagram{margin:0 0 26px;border:1px solid var(--edge);border-radius:12px;padding:14px 16px 10px;
  background:linear-gradient(160deg,rgba(45,212,232,.07),rgba(255,255,255,.012))}
.diagram svg.dg{display:block;width:100%;height:auto}
.dcap{font-family:var(--display);font-size:11px;letter-spacing:.12em;color:var(--cyan);opacity:.8;padding:2px 2px 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cols h4{margin:0 0 10px;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--cyan)}
.err h4{color:var(--bad)}
.cols ol,.cols ul{margin:0;padding-left:1.25em;font-size:15.5px;color:var(--ink);line-height:1.8}
.cols li{margin-bottom:7px}
.coachcue{margin-top:24px;padding:16px 18px;border-radius:11px;border:1px solid rgba(139,123,255,.28);
  background:rgba(139,123,255,.08);font-size:15.5px}
.coachcue b{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;color:var(--violet);display:block;margin-bottom:5px;font-weight:600}
.vids{margin-top:26px}
.vids h4{margin:0 0 12px;font-family:var(--display);font-size:12px;letter-spacing:.12em;color:var(--cyan)}
.vidgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.vidcard{display:block;border-radius:12px;overflow:hidden;border:1px solid var(--edge);background:var(--glass);
  color:var(--ink);transition:transform .32s cubic-bezier(.2,.8,.3,1),border-color .32s,box-shadow .32s}
.vidcard:hover{transform:translateY(-4px);border-color:rgba(45,212,232,.45);box-shadow:0 18px 40px -24px rgba(45,212,232,.8)}
.thumb{position:relative;aspect-ratio:16/9;background:linear-gradient(140deg,#16202E,#0B111C);display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,13,.28);transition:background .3s}
.vidcard:hover .thumb .pl{background:rgba(5,7,13,.1)}
.thumb .pl span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  background:rgba(5,7,13,.62);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(6px)}
.thumb .pl svg{width:16px;height:16px;fill:#fff;stroke:none;margin-left:2px}
.vidcard .cap{padding:12px 14px 14px;font-size:14px;line-height:1.55;color:var(--ink)}
.vidcard .cap i{display:block;font-style:normal;font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--cyan);margin-top:6px;opacity:.8}

.tac{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:34px;align-items:start}
.player{transition:transform .7s cubic-bezier(.3,.05,.2,1)}
@media (prefers-reduced-motion:reduce){.player{transition:none}}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.steps button{font:inherit;font-size:14.5px;font-weight:400;border:1px solid var(--edge);background:var(--glass);color:var(--muted);
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:.28s}
.steps button:hover{color:var(--ink);border-color:var(--edge2)}
.steps button[aria-pressed="true"]{background:linear-gradient(120deg,rgba(59,123,255,.9),rgba(139,123,255,.9));color:#fff;border-color:transparent;
  box-shadow:0 6px 20px -8px rgba(59,123,255,.9)}
.phase h3{font-size:23px}
.phase p{color:var(--muted);margin:0;font-size:16px;line-height:1.85}
.think{margin:22px 0 10px;padding:16px 18px;border-radius:11px;border:1px solid rgba(45,212,232,.26);background:rgba(45,212,232,.07)}
.think b{font-family:var(--display);font-size:11.5px;letter-spacing:.12em;color:var(--cyan);display:block;margin-bottom:5px;font-weight:600}
.think span{font-size:15.5px}
.legend{display:flex;gap:18px;font-size:14px;color:var(--faint);margin-top:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px}
details{border:1px solid var(--edge);border-radius:12px;padding:0 20px;margin-bottom:10px;background:var(--glass);transition:border-color .3s}
details[open]{border-color:rgba(59,123,255,.35)}
summary{cursor:pointer;font-weight:400;padding:16px 0;list-style:none;display:flex;align-items:center;gap:12px;font-size:16px}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:9px;height:9px;flex:none;border-right:1.5px solid var(--cyan);border-bottom:1.5px solid var(--cyan);
  transform:rotate(-45deg);transition:transform .3s}
details[open] summary::before{transform:rotate(45deg)}
details>div{padding:0 0 18px 21px;color:var(--muted);font-size:15.5px;line-height:1.85}

.rulegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.score{padding:28px;border-radius:var(--r);border:1px solid rgba(59,123,255,.28);
  background:linear-gradient(165deg,rgba(59,123,255,.1),rgba(8,12,20,.6));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.lbl{font-family:var(--display);font-size:11.5px;letter-spacing:.14em;color:var(--faint)}
.score .call{font-family:var(--display);font-weight:700;font-size:70px;line-height:1.05;letter-spacing:.02em;margin:6px 0 2px;
  background:linear-gradient(130deg,#fff,var(--cyan) 65%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.score .who{color:var(--muted);font-size:15px;margin:2px 0 20px}
.score .teams{display:flex;gap:12px;margin-bottom:18px}
.score .team{flex:1;border-radius:11px;padding:13px 15px;border:1px solid var(--edge);background:var(--glass);transition:.3s}
.score .team.serve{border-color:rgba(45,212,232,.5);box-shadow:0 0 22px -8px rgba(45,212,232,.8)}
.score .team .tn{font-size:13px;color:var(--faint)}
.score .team .n{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1}
.score .team .pp{font-size:12.5px;color:var(--faint)}
.score .btns{display:flex;flex-wrap:wrap;gap:9px}
.score .btns button{font:inherit;font-size:14.5px;font-weight:400;border-radius:999px;padding:10px 18px;cursor:pointer;border:1px solid transparent;transition:.28s}
.b-win{background:linear-gradient(120deg,var(--blue),var(--violet));color:#fff}
.b-win:hover:not(:disabled){transform:translateY(-2px)}
.b-lose{background:var(--glass2);color:var(--ink);border-color:var(--edge)!important}
.b-ghost{background:transparent;color:var(--muted);border-color:var(--edge)!important}
.score button:disabled{opacity:.35;cursor:default}
.score .log{font-size:14px;color:var(--faint);margin-top:16px;min-height:1.6em}
.quiz{padding:28px}
.quiz .q{font-size:17px;margin:10px 0 20px;line-height:1.75}
.quiz .opts{display:flex;gap:11px}
.quiz .opts button{flex:1;font:inherit;font-size:15px;font-weight:500;padding:14px;border-radius:11px;border:1px solid var(--edge);
  background:var(--glass);color:var(--ink);cursor:pointer;transition:.28s}
.quiz .opts button:not(:disabled):hover{border-color:rgba(45,212,232,.45);background:var(--glass2);transform:translateY(-2px)}
.quiz .opts button:disabled{opacity:.45}
.quiz .fb{margin-top:18px;min-height:3.4em;font-size:15.5px;color:var(--muted);line-height:1.8}
.quiz .fb .v{font-weight:500}
.ok{color:var(--good)} .no{color:var(--bad)}
.quiz .qnav{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px;color:var(--faint)}
.quiz .qnav button{font:inherit;border:0;background:none;color:var(--cyan);cursor:pointer;padding:0}
.links{margin-top:26px;padding:22px 24px}

footer{border-top:1px solid var(--edge);margin-top:40px;padding:48px 0 44px}

footer ul{list-style:none;margin:0;padding:0;font-size:15px}
footer li{margin-bottom:8px}

footer li a:hover,footer li button:hover{color:var(--ink)}
.fbot{margin-top:38px;padding-top:22px;border-top:1px solid var(--edge);font-size:15px;color:var(--muted)}
.fbot b{font-size:17px;font-weight:700;color:var(--ink)}

.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.8,.3,1),transform .8s cubic-bezier(.2,.8,.3,1)}

@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}

@media (max-width:900px){

  section{padding:26px 0 56px}
}

 {"t": "球網", "big": "86.4 / 91.4 cm", "p": ["中央高 34 英寸（86.4 cm），網柱處高 36 英寸（91.4 cm）。", "發球擦網後落在正確發球區，繼續比賽，不重發。", "球在比賽中時，球員或球拍碰網、碰網柱都是失誤。"]}}, "eq": [{"t": "球拍", "p": "表面平滑、無彈性網線的實心拍。長度加寬度合計不超過 <span class=\"spec\">24 in / 61 cm</span>，長度不超過 <span class=\"spec\">17 in / 43 cm</span>，厚度與重量沒有上限。", "d": [["常見重量", "約 210–240 g；輕拍好控制，重拍較有力量"], ["拍面材質", "玻璃纖維、碳纖維為主"], ["握把", "握住時食指與手掌間約留一指寬"], ["初學建議", "中等重量、拍面較寬，甜區大、容錯高"]]}, {"t": "球", "p": "有圓孔的硬塑膠球，直徑 <span class=\"spec\">7.3–7.5 cm</span>，重量 <span class=\"spec\">22–26.5 g</span>，孔數 26–40 個。", "d": [["室外球", "約 40 個小孔，材質較硬，抗風"], ["室內球", "約 26 個較大孔，較軟、彈跳較慢"], ["顏色", "單一顏色即可，常用亮黃綠色以利辨識"], ["注意", "室外球在低溫時容易裂，裂球請立即更換"]]}, {"t": "球網", "p": "中央高 <span class=\"spec\">86.4 cm / 34 in</span>，兩側網柱處高 <span class=\"spec\">91.4 cm / 36 in</span>，比網球網低。", "d": [["上課檢查", "用球拍量網高：拍長加拍寬約為中央網高"], ["觸網", "球在場上時，身體或球拍碰到網或網柱即失誤"]]}, {"t": "服裝與安全", "p": "匹克球大量橫向移動與急停，鞋子比球拍更影響安全。", "d": [["鞋", "室內球鞋或網球鞋，避免跑鞋（側向支撐不足）"], ["護目", "廚房線近距離對打時建議配戴運動護目鏡"], ["場地", "課前清空場上散落的球，避免踩球扭傷"], ["熱身", "著重腳踝、小腿、肩關節與手腕"]]}], "skillsHead": {"eyebrow": "02 / SKILLS", "h2": "動作示例", "p": "每個動作附示意圖、技術要點與常見錯誤。擔任小隊教練時，可以用「同儕觀察重點」檢核隊友的動作。示範影片為英文頻道。"}, "skillLabels": {"diagram": "TECHNIQUE DIAGRAM · 動作示意", "tech": "TECHNIQUE · 技術要點", "err": "COMMON ERRORS · 常見錯誤", "cue": "PEER OBSERVATION · 同儕觀察重點", "vid": "DEMO VIDEOS · 示範影片", "novid": "這個動作還沒有指定影片，先用搜尋結果參考。", "search": "YouTube 搜尋："}, "tacticsHead": {"eyebrow": "03 / TACTICS", "h2": "雙打戰術：一個回合的五個階段", "p": "匹克球雙打的核心是「兩人一起前進到廚房線」。依序點選各階段，觀察四位球員的站位如何變化，再回答思考問題。"}, "tacticsLabels": {"think": "TEAM THINKING · 小隊思考", "recv": "接發球方", "serv": "發球方", "nextPhase": "下一階段：", "legendEnd": "圖中 R 為接發球方、S 為發球方，虛線為這一拍的球路。", "scenH2": "戰術情境卡", "scenP": "小隊討論用。先各自寫下想法，再打開看提示，最後到場上驗證。"}, "rulesHead": {"eyebrow": "04 / RULES & SCORING", "h2": "核心規則", "p": "以下以 USA Pickleball 官方規則的雙打標準賽制（發球得分制）為準，正式比賽請以當年度規則書為依據。"}, "rulesLabels": {"h2b": "記分練習與規則判斷", "pb": "左邊模擬雙打記分，記分員練習報分；右邊是情境判斷題，裁判組可以用來自我檢核。", "call": "CALL THE SCORE · 發球前請報分", "server": "發球員", "left": "左", "right": "右", "svcArea": "發球區", "teamA": "A 隊", "teamB": "B 隊", "winBtn": "發球方贏這球", "loseBtn": "接發方贏這球", "undo": "上一步", "newGame": "新的一局", "over": "比賽結束", "start": "比賽開始，第一位發球員從右發球區發球。", "case": "CASE", "legal": "好球 · 合法", "fault": "失誤 · 違例", "correct": "判斷正確。", "wrong": "再想想。", "score": "答對", "scoreUnit": "題", "prevQ": "← 上一題", "nextQ": "下一題 →", "linksH": "官方資料與示範影片"}, "semHead": {"eyebrow": "05 / SEASON & ROLES", "h2": "運動教育模式：一個球季的節奏", "p": "整學期以固定小隊進行，每位同學除了是球員，也輪流擔任一項職務。", "h2b": "角色與職責", "pb": "勾選清單只保存在你自己的瀏覽器，用來提醒自己本週的工作。"}, "season": [["PHASE 01", "季前練習", "分組、選角色、學習基本動作與規則"], ["PHASE 02", "季前賽", "小隊練習賽，熟悉記分與輪值"], ["PHASE 03", "正式賽季", "循環賽累積積分，紀錄數據"], ["PHASE 04", "季後賽與頒獎", "冠軍賽、公平競賽獎、角色表現獎"]], "footer": {"p": "大學運動教育模式匹克球課程數位教材。規則內容依 USA Pickleball 2026 年版官方規則整理，如有差異以官方規則書為準。", "h1": "MODULES", "h2": "RESOURCES", "bot": "PICKLE.LAB · 教學用途數位教材", "dev": "開發者"}, "links": [["USA Pickleball 官方規則頁", "https://usapickleball.org/what-is-pickleball/official-rules/", "規則書、年度異動與裁判案例彙編"], ["What is the Kitchen in Pickleball（USA Pickleball 官方頻道）", "https://www.youtube.com/watch?v=HVTQ-_vQhK8", ""], ["Rules to Remember at the Pickleball Kitchen（裁判講解）", "https://www.youtube.com/watch?v=JCXWSDlDL38", ""], ["How to Serve Legally: Learn the 2 Pickleball Serves（裁判講解）", "https://www.youtube.com/watch?v=HtaMX3f5zyE", ""]], "flinks": [["USA Pickleball 官方規則", "https://usapickleball.org/what-is-pickleball/official-rules/"], ["Kitchen 規則影片", "https://www.youtube.com/watch?v=HVTQ-_vQhK8"], ["合法發球影片", "https://www.youtube.com/watch?v=HtaMX3f5zyE"]], "skills": [{"k": "grip", "n": "握拍", "p": "大陸式握拍讓正手、反手、截擊不必換握，是網前快速交換球時的基礎。", "kk": ["像握手一樣握住握把，虎口的 V 字對準握把左上稜（右手持拍）。", "握力約 3–4 分（10 分最緊），手腕保持放鬆。", "食指可稍微分開，增加拍面控制。"], "e": ["像拿平底鍋一樣從上方握住（西方式），反手很難處理。", "握太緊，Dink 時球容易彈太高。"], "c": "觀察隊友虎口位置，並請他在不換握的情況下連續做正手與反手揮拍。"}, {"k": "ready", "n": "準備姿勢", "p": "讓身體隨時能往左右與前後移動，是所有擊球的起點。", "kk": ["雙腳與肩同寬或稍寬，膝蓋微彎，重心在前腳掌。", "球拍放在身體前方、約胸口高度，拍頭朝上。", "每次擊球後立刻回到準備姿勢。"], "e": ["擊球後停在原地看球，來不及準備下一拍。", "球拍垂在腰部以下，面對快球來不及反應。"], "c": "每一拍擊球後，數一數隊友是否在對手觸球前回到準備姿勢。"}, {"k": "serve", "n": "發球", "p": "把球穩定、深遠地送到對角發球區，讓接發者難以回出攻擊球。", "kk": ["截擊式發球：由下往上揮，擊球點在腰部以下，擊球時拍頭不能高於手腕。", "落地式發球：讓球自然落下（不可拋或推），彈地後再擊，揮拍方式不受限。", "瞄準對方底線附近，深球比快球更重要。", "擊球時雙腳不能踩到底線或場內。"], "e": ["拍頭高於手腕的側旋上抽發球，違反截擊式發球規定。", "追求速度而發球出界，發球方每一分都很珍貴。"], "c": "請隊友連發 10 球，記錄落在後半場（接近底線）的球數。"}, {"k": "return", "n": "接發球", "p": "回一顆深而高的球，爭取時間讓自己前進到廚房線。", "kk": ["站在底線附近，讓發球先彈地（雙彈跳規則）。", "回球瞄準對方底線，弧度可以稍高。", "擊球後立刻往前移動到廚房線。"], "e": ["回完球留在底線，失去上網的機會。", "回球太短，讓發球方可以輕鬆進攻。"], "c": "觀察隊友擊球後的第一步：往前走，還是留在原地？"}, {"k": "dink", "n": "Dink（吊小球）", "p": "在廚房線互相把球輕放進對方廚房，逼對手擊出較高的球。", "kk": ["以肩膀帶動、像鐘擺一樣推送，手腕不要翻動。", "膝蓋彎曲降低身體，拍面稍微打開。", "讓球過網時剛好高一點點，落在對方廚房內。", "瞄準對手腳邊或斜對角。"], "e": ["用手腕甩，力道不穩，球飄太高被對手扣殺。", "站得太直，只用手去撈球。"], "c": "計算隊友連續 Dink 不失誤、且球落在廚房內的次數。"}, {"k": "drop", "n": "第三拍 Drop", "p": "發球方的第三拍，用軟吊把球放進對方廚房，爭取時間讓兩人上網。", "kk": ["從底線附近以由下往上的弧線輕推，擊球點在身體前方。", "球的最高點在自己這一側，下降過網後落進廚房。", "擊球後分段前進（前進、停步、再前進），不要一路衝到網前。"], "e": ["球打太平太高，接近網前的對手直接截擊攻擊。", "擊球後衝太快，被對手打到腳邊。"], "c": "記錄隊友 10 次第三拍中，對手必須讓球落地後才能處理的次數。"}, {"k": "drive", "n": "抽球（Drive）", "p": "有力的平擊或上旋球，用來逼迫對手或製造較弱的回球。", "kk": ["側身轉體，由下往上刷球，帶一點上旋讓球下墜。", "擊球點在身體前方、腰部高度。", "適合對手還在後場，或回球偏高時使用。"], "e": ["只用手臂出力，缺乏轉體，球無力又容易出界。", "在不利位置硬抽，反而讓對手輕鬆截擊。"], "c": "請隊友說明：這一球為什麼選擇抽球而不是 Drop？"}, {"k": "volley", "n": "截擊", "p": "在球落地前擊球，縮短對手的反應時間。只能在廚房外進行。", "kk": ["拍面保持在身體前方，動作小，像「擋」或「推」。", "高球用下壓的截擊（Punch），低球用擋回的截擊（Block）。", "擊球後保持平衡，身體不能因慣性踩進廚房。"], "e": ["大揮拍，來不及處理快速來球。", "截擊後重心往前，腳踩進廚房被判失誤。"], "c": "觀察隊友截擊時雙腳的位置，是否始終留在廚房線後方。"}, {"k": "lob", "n": "挑高球（Lob）", "p": "把球挑過網前對手的頭頂，逼對方後退，打破廚房線對峙。", "kk": ["用和 Dink 相似的準備動作，讓對手難以預判。", "高度要超過對手的球拍可及範圍，落點在底線附近。", "挑高球後準備防守對方的高壓球。"], "e": ["挑得不夠高，直接被扣殺。", "挑太頻繁，失去出其不意的效果。"], "c": "記錄挑高球成功讓對手退後的比例。"}, {"k": "smash", "n": "高壓扣殺", "p": "處理過高的來球，以向下的角度得分。", "kk": ["側身，非持拍手指向來球幫助定位。", "擊球點在頭頂前上方，向下壓球。", "瞄準對手腳邊或兩人中間。"], "e": ["面對來球倒退跑，容易失去平衡跌倒。", "正面站立揮拍，角度與力量都不足。"], "c": "檢查隊友是否側身移動後退，而不是面朝前方倒退。"}, {"k": "reset", "n": "Reset（重置球）", "p": "被對手攻擊時，把快球卸力、軟放回對方廚房，把回合拉回平衡。", "kk": ["放鬆握拍，讓拍面吸收球速。", "拍面稍微打開，動作極小。", "目標是讓球落進廚房，而不是反擊得分。"], "e": ["想用力反擊，失誤率高。", "握太緊，球反彈過高。"], "c": "在對手連續攻擊時，數隊友成功 Reset 的次數。"}], "phases": [{"t": "發球", "d": "發球員在右發球區底線後發球，斜對角送到對方發球區。發球方兩人都留在底線，因為雙彈跳規則規定第三拍必須等球落地。接發方的搭檔可以先站到廚房線。", "q": "為什麼發球方的搭檔不能一開始就站到網前？如果站上去，會發生什麼事？"}, {"t": "接發球", "d": "接發者讓球彈地後，回一顆深球到發球方底線，並立刻前進到廚房線，和搭檔並排。此時接發方已經佔到最有利的位置。", "q": "接發球要打深還是打快？哪一種能讓你有更多時間上網？"}, {"t": "第三拍 Drop", "d": "發球方用第三拍 Drop 把球軟放進對方廚房。對手只能等球落地、向上處理，發球方趁這段時間往前推進到過渡區。", "q": "如果你的第三拍打得太高，網前的對手會怎麼處理？你該怎麼調整？"}, {"t": "廚房線對峙", "d": "四人都在廚房線，進入 Dink 對打。雙方比的是耐心：誰先把球打高，誰就給對手進攻的機會。", "q": "Dink 對打時，你要打向對手的哪裡？直線、斜線，還是兩人中間？各有什麼好處？"}, {"t": "進攻時機", "d": "對手回球偏高、超過網子高度時，就是截擊下壓的時機。攻擊目標優先選兩人中間或對手持拍側的腳邊。如果來球低於網高，繼續 Dink 或 Reset，不要硬攻。", "q": "你怎麼判斷一顆球「可以攻」還是「應該繼續 Dink」？試著說出你用來判斷的線索。"}], "scen": [{"q": "對手一直把接發球打到我們底線深處，我們上不了網。", "a": "先確認是第三拍的品質問題，還是移動問題。可以練習在深球時用較高弧度的 Drop，並採分段前進：打完一拍前進幾步，對手觸球時停步準備，再繼續前進。"}, {"q": "Dink 對打時，我們總是先失誤。", "a": "檢查三件事：膝蓋是否彎曲、是否用手腕甩球、球的目標是否太貼近網。可以先把目標訂為「落在廚房中段」，穩定後再追求角度。"}, {"q": "對手有一位很強、一位較弱，要怎麼打？", "a": "多數回合可以把球送到較弱的一側，但要注意強者可能會移位搶球。討論：搶球時，對方哪一側會出現空檔？"}, {"q": "我們兩人常常同時去追同一顆中間球。", "a": "事先約定規則，例如「正手在中間的人負責中間球」，或由位於斜對角、角度較好的一方處理。比賽前在小隊內用一句話說清楚。"}, {"q": "對手常常挑高球，我們一直被逼退。", "a": "觀察對手挑球前的準備動作，稍微提早後退半步；站位不要太貼近廚房線。也可以討論：我們的 Dink 是不是太好挑，例如打得太高或太靠中間。"}], "rules": [{"t": "發球", "a": "發球必須斜對角送到對方發球區，並越過廚房（落在廚房線上算失誤）。截擊式發球要由下往上揮、擊球點在腰部以下、拍頭不高於手腕；落地式發球則讓球自然落下，彈地後再擊。每位發球員只有一次發球機會；擦網後落在正確區域，繼續比賽。"}, {"t": "雙彈跳規則", "a": "發球後，接發方必須讓球先彈地一次才能回擊；接著發球方也必須讓回球彈地一次。這兩次彈地之後，雙方才可以截擊或讓球落地擊球。"}, {"t": "廚房（非截擊區）", "a": "站在廚房內或踩到廚房線時不可以截擊。截擊後因慣性踩進廚房，即使球已經死球，仍判失誤。球落地後，可以隨時進入廚房擊球。"}, {"t": "計分（發球得分制）", "a": "只有發球方可以得分。一般每局 11 分，須領先 2 分才獲勝。雙打報分為三個數字：發球方分數、接發方分數、發球員順序（1 或 2）。每局開始時由 0-0-2 起算，第一個發球的隊伍只有一位發球員。部分賽會改用每球得分制（rally scoring），請以賽會規定為準。"}, {"t": "換發球", "a": "發球方得分時，發球員與搭檔交換左右位置，同一人繼續發球。發球方失分時，換搭檔發球（第二發球員）；兩人都失分後換對方發球（side out），由當時站在右發球區的球員先發。"}, {"t": "常見失誤", "a": "球出界、未過網、違反雙彈跳規則、廚房內截擊、球打到球員身體或衣物、球在比賽中時觸網或碰網柱、發球時腳踩線。壓到線的球都算界內（發球落在廚房線上例外）。"}, {"t": "線審與自我判決", "a": "一般練習與友誼賽由接球方判自己半場的界內外。無法立即而且確定地判定出界時，就算界內，讓對手得到有利判決。"}], "quiz": [{"q": "發球落在對方的廚房線上。", "a": false, "e": "廚房線屬於廚房，發球落在線上是發球失誤。"}, {"q": "發球擦網後，落在正確的發球區內，繼續比賽。", "a": true, "e": "現行規則已取消擦網重發，擦網後落在正確區域就是好球。"}, {"q": "接發者回球後，發球方在球落地前直接截擊。", "a": false, "e": "違反雙彈跳規則：發球方的第三拍也必須等球落地。"}, {"q": "球員在廚房外截擊，擊球後慣性讓腳踩進廚房。", "a": false, "e": "只要是截擊動作帶來的慣性，踩進廚房都算失誤，即使球已經死球。"}, {"q": "球先落在廚房內，球員走進廚房把球擊回。", "a": true, "e": "球落地後就不是截擊，可以進入廚房擊球。"}, {"q": "來球落在底線上。", "a": true, "e": "壓線球算界內（只有發球落在廚房線上例外）。"}, {"q": "接發球方贏得這一球，所以接發球方得 1 分。", "a": false, "e": "標準賽制只有發球方能得分，接發方贏球只會造成換發球員或換發。"}, {"q": "來球打到球員的手臂後彈過網，落在對方場內。", "a": false, "e": "球打到身體或衣物（持拍手手腕以下的部位視同球拍，不在此限）時，被打到的一方失誤。"}, {"q": "發球擊球瞬間，發球員的腳踩在底線上。", "a": false, "e": "擊球時雙腳不可接觸底線或場內，否則是發球失誤。"}], "roles": [{"n": "小隊教練", "d": "帶領暖身與技術練習，依動作示例的同儕觀察重點給隊友回饋。", "c": ["課前確認本週要練的動作", "帶領 10 分鐘小隊練習", "記錄每位隊友一項進步與一項待改善"]}, {"n": "隊長", "d": "協調隊內分工與出賽名單，處理小隊內部的意見分歧。", "c": ["排定本週出賽組合", "確認每個人都有擔任職務", "比賽後帶領小隊討論一個戰術情境"]}, {"n": "裁判", "d": "依規則執法，判斷廚房違例、發球失誤與界內外。", "c": ["課前完成規則判斷題", "比賽中清楚報出失誤原因", "賽後與雙方確認有爭議的判決"]}, {"n": "記分員", "d": "每球發球前大聲報分，並記錄比賽結果。", "c": ["用記分練習熟悉三碼報分", "每球發球前報分", "賽後將比分交給統計員"]}, {"n": "統計員", "d": "紀錄小隊數據，例如發球成功率、第三拍落點、失誤類型。", "c": ["準備本週統計表", "記錄至少一場比賽的數據", "向小隊報告一項數據發現"]}, {"n": "器材與安全", "d": "負責場地、器材與熱身安全。", "c": ["課前檢查網高與場地", "清點球拍與球，更換裂球", "確認小隊完成熱身"]}], "diag": {"grip": "<svg viewBox=\"0 0 600 250\" class=\"dg\" role=\"img\" aria-label=\"grip\"><defs><marker id=\"arw\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0.5 L8 4 L0 7.5 z\" fill=\"#8B7BFF\"/></marker><marker id=\"arwr\" markerWidth=\"8\" markerHeight=\"8\" refX=\"7\" refY=\"4\" orient=\"auto\"><path d=\"M0 0.5 L8 4 L0 7.5 z\" fill=\"#FF6B81\"/></marker></defs>\n<polygon points=\"372.1,86.2 329.8,43.9 270.2,43.9 227.9,86.2 227.9,145.8 270.2,188.1 329.8,188.1 372.1,145.8\" fill=\"rgba(255,255,255,.03)\" stroke=\"rgba(240,245,250,.5)\" stroke-width=\"2\"/>\n<line x1=\"329.8\" y1=\"43.9\" x2=\"270.2\" Grotesk,sans-serif\" font-size=\"11\" letter-spacing=\"1.1\" fill=\"#2DD4E8\" text-anchor=\"start\">RESET</text></svg>"}}, "en": {"nav": {"home": "Home", "gear": "Equipment & Court", "skills": "Skills", "tactics": "Tactics", "rules": "Rules & Scoring", "sem": "Class Roles"}, "hero": {"tag": "SPORT EDUCATION MODEL · PICKLEBALL", "h1": "Everything a pickleball<br><span>season needs</span>, on one page", "sub": "Equipment specifications, stroke technique, doubles tactics and rule judgments. Read before class, check during practice, use throughout the season. Every module is interactive.", "cta1": "Start learning", "cta2": "Scoring practice", "creditLabel": "Developed by", "creditName": "Lu-Hsien Chen, Ming Chi University of Technology", "vtop": "COURT / 20 × 44 FT", "vbot": "NET 34 / 36 IN"}, "modules": {"eyebrow": "MODULES", "h2": "Five modules that follow the season", "p": "From equipment to season roles, every module has something you can work through hands-on."}, "feats": [{"t": "Equipment & Court", "p": "Interactive court map, official paddle and ball specifications, safety notes.", "g": "01 / EQUIPMENT"}, {"t": "Skills", "p": "Diagrams, technique points, common errors and demo videos for 11 strokes.", "g": "02 / SKILLS"}, {"t": "Tactics", "p": "Five-stage animated doubles positioning, with team discussion questions.", "g": "03 / TACTICS"}, {"t": "Rules & Scoring", "p": "Three-number score simulator and nine rule scenarios for referee self-check.", "g": "04 / RULES"}, {"t": "Class Roles", "p": "Four season phases and task checklists for six team duties.", "g": "05 / ROLES"}], "stats": [["11", "Stroke units"], ["5", "Rally stages"], ["9", "Rule scenarios"], ["6", "Season roles"]], "back": "Home", "prev": "← ", "next": " →", "gear": {"eyebrow": "01 / EQUIPMENT & COURT", "h2": "The court: start with the kitchen", "p": "A pickleball court is the same size as a badminton doubles court. Select an area to see what it means for the rules and for tactics.", "courtLabels": {"nvz": "NVZ", "service": "SERVICE"}, "defaultZone": {"t": "Full court", "big": "20 × 44 ft", "p": ["6.10 × 13.41 m. Singles and doubles use the same court. Lines are in, so a ball touching any line is good."], "hint": "Select the kitchen, service area, kitchen line, baseline or net on the diagram."}, "eqH2": "Equipment specifications", "eqP": "Compiled from the USA Pickleball official rules. School equipment is fine for class; the buying notes are for students choosing their own."}, "zones": {"kitchen": {"t": "Kitchen (non-volley zone)", "big": "7 ft / 2.13 m", "p": ["The 7-foot area on each side of the net, officially the non-volley zone.", "You may not volley while standing in the kitchen or on its line, meaning you cannot hit the ball before it bounces. Once the ball has bounced, you may step in and play it.", "This rule stops pickleball from becoming a smashing contest at the net, and it is the reason the dink exists."]}, "kline": {"t": "Kitchen line", "big": "Part of the kitchen", "p": ["The line counts as the kitchen: touching it while volleying is a fault.", "A serve landing on the kitchen line is also a fault.", "In doubles, both partners standing just behind this line is the strongest attacking position."]}, "svc": {"t": "Service area", "big": "10 × 15 ft", "p": ["The centre line divides the area between the kitchen line and the baseline into two service courts.", "The serve must travel diagonally into the opponent's service court and clear the kitchen. Touching the centre, side or baseline is good.", "When the serving team's score is even, the first server of that game is in the right service court."]}, "base": {"t": "Baseline", "big": "Serving position", "p": ["At least one foot must be on the ground behind the baseline, and neither foot may touch the line or the court until after contact.", "A ball landing on the baseline is in.", "The receiver stands near the baseline, ready to let the serve bounce."]}, "net": {"t": "Net", "big": "34 / 36 in", "p": ["34 inches (86.4 cm) at the centre, 36 inches (91.4 cm) at the posts, lower than a tennis net.", "A serve that clips the net and lands in the correct service court is played, not replayed.", "Touching the net or net post with your body or paddle while the ball is live is a fault."]}}, "eq": [{"t": "Paddle", "p": "A solid paddle with a smooth surface and no strings. Length plus width may not exceed <span class=\"spec\">24 in / 61 cm</span>, and length may not exceed <span class=\"spec\">17 in / 43 cm</span>. There is no limit on thickness or weight.", "d": [["Typical weight", "210–240 g; lighter paddles control better, heavier ones give more power"], ["Face material", "Mostly fibreglass or carbon fibre"], ["Grip size", "About one finger's width between fingertips and palm"], ["For beginners", "Mid-weight with a wider face: larger sweet spot, more forgiving"]]}, {"t": "Ball", "p": "A hard plastic ball with round holes, <span class=\"spec\">7.3–7.5 cm</span> in diameter, <span class=\"spec\">22–26.5 g</span>, with 26 to 40 holes.", "d": [["Outdoor ball", "About 40 small holes, harder, resists wind"], ["Indoor ball", "About 26 larger holes, softer, slower bounce"], ["Colour", "A single colour; bright yellow-green is common for visibility"], ["Note", "Outdoor balls crack easily in cold weather; replace a cracked ball at once"]]}, {"t": "Net", "p": "<span class=\"spec\">86.4 cm / 34 in</span> at the centre and <span class=\"spec\">91.4 cm / 36 in</span> at the posts, lower than a tennis net.", "d": [["Quick check", "Measure with a paddle: its length plus width is roughly the centre net height"], ["Net contact", "Touching the net or post with body or paddle while the ball is live is a fault"]]}, {"t": "Clothing & safety", "p": "Pickleball involves constant lateral movement and sudden stops, so shoes matter more for safety than the paddle does.", "d": [["Shoes", "Court or tennis shoes; avoid running shoes, which lack lateral support"], ["Eyewear", "Protective eyewear is advisable during close exchanges at the kitchen line"], ["Court", "Clear stray balls before class to avoid rolling an ankle"], ["Warm-up", "Focus on ankles, calves, shoulders and wrists"]]}], "skillsHead": {"eyebrow": "02 / SKILLS", "h2": "Stroke technique", "p": "Each stroke has a diagram, technique points and common errors. As team coach, use the peer observation prompt to check your teammates."}, "skillLabels": {"diagram": "TECHNIQUE DIAGRAM", "tech": "TECHNIQUE", "err": "COMMON ERRORS", "cue": "PEER OBSERVATION", "vid": "DEMO VIDEOS", "novid": "No video assigned yet for this stroke; search results are provided instead.", "search": "YouTube search: "}, "tacticsHead": {"eyebrow": "03 / TACTICS", "h2": "Doubles tactics: the five stages of a rally", "p": "Doubles pickleball is built on getting both partners to the kitchen line together. Step through each stage, watch how the four players move, then answer the discussion question."}, "tacticsLabels": {"think": "TEAM THINKING", "recv": "Receiving team", "serv": "Serving team", "nextPhase": "Next stage: ", "legendEnd": "R marks the receiving team, S the serving team; the dashed line is the ball path for this shot.", "scenH2": "Tactical scenario cards", "scenP": "For team discussion. Write your own answer first, then open the hint, then test it on court."}, "rulesHead": {"eyebrow": "04 / RULES & SCORING", "h2": "Core rules", "p": "Based on the standard doubles format (side-out scoring) in the USA Pickleball official rules. For sanctioned play, follow the current rulebook."}, "rulesLabels": {"h2b": "Scoring practice and rule judgments", "pb": "On the left, a doubles score simulator for scorekeepers to practise the call. On the right, rule scenarios for the referee group to self-check.", "call": "CALL THE SCORE BEFORE SERVING", "server": "Server", "left": "left", "right": "right", "svcArea": "service court", "teamA": "Team A", "teamB": "Team B", "winBtn": "Serving team wins", "loseBtn": "Receiving team wins", "undo": "Undo", "newGame": "New game", "over": "Game over", "start": "Game start. The first server serves from the right service court.", "case": "CASE", "legal": "Legal · good", "fault": "Fault · violation", "correct": "Correct.", "wrong": "Not quite.", "score": "Correct:", "scoreUnit": "", "prevQ": "← Previous", "nextQ": "Next →", "linksH": "Official resources and videos"}, "semHead": {"eyebrow": "05 / SEASON & ROLES", "h2": "Sport Education Model: the rhythm of a season", "p": "Students stay in fixed teams for the whole term. Besides playing, each student takes a turn at one duty.", "h2b": "Roles and responsibilities", "pb": "The checklist is stored only in your own browser, as a reminder of this week's duties."}, "season": [["PHASE 01", "Pre-season practice", "Form teams, choose roles, learn basic strokes and rules"], ["PHASE 02", "Pre-season matches", "Team practice matches; get used to scoring and rotation"], ["PHASE 03", "Regular season", "Round-robin points and data recording"], ["PHASE 04", "Play-offs and awards", "Final, fair-play award, role performance award"]], "footer": {"p": "Digital teaching material for a university Sport Education Model pickleball course. Rules compiled from the USA Pickleball 2026 official rulebook; the rulebook governs where they differ.", "h1": "MODULES", "h2": "RESOURCES", "bot": "PICKLE.LAB · Teaching material", "dev": "Developed by"}, "links": [["USA Pickleball official rules", "https://usapickleball.org/what-is-pickleball/official-rules/", "Rulebook, annual rule changes and the officiating casebook"], ["What is the Kitchen in Pickleball (USA Pickleball)", "https://www.youtube.com/watch?v=HVTQ-_vQhK8", ""], ["Rules to Remember at the Pickleball Kitchen", "https://www.youtube.com/watch?v=JCXWSDlDL38", ""], ["How to Serve Legally: Learn the 2 Pickleball Serves", "https://www.youtube.com/watch?v=HtaMX3f5zyE", ""]], "flinks": [["USA Pickleball official rules", "https://usapickleball.org/what-is-pickleball/official-rules/"], ["Kitchen rules video", "https://www.youtube.com/watch?v=HVTQ-_vQhK8"], ["Legal serve video", "https://www.youtube.com/watch?v=HtaMX3f5zyE"]], "skills": [{"k": "grip", "n": "Grip", "p": "The continental grip lets you hit forehands, backhands and volleys without changing grip, which is essential in fast exchanges at the net.", "kk": ["Hold the handle as if shaking hands, with the V of your thumb and index finger on the upper-left bevel (right-handed).", "Grip pressure around 3–4 out of 10, wrist relaxed.", "Separating the index finger slightly improves paddle-face control."], "e": ["Holding the paddle from above like a frying pan (western grip) makes backhands very difficult.", "Gripping too tightly makes dinks pop up."], "c": "Check where your teammate's V sits, then ask them to alternate forehand and backhand swings without changing grip."}, {"k": "ready", "n": "Ready position", "p": "A stance that lets you move sideways, forwards and backwards at any moment. Every stroke starts here.", "kk": ["Feet shoulder-width or slightly wider, knees bent, weight on the balls of the feet.", "Paddle in front of the body at about chest height, head of the paddle up.", "Return to this position immediately after every shot."], "e": ["Standing still to watch the ball after hitting, leaving no time to prepare.", "Letting the paddle drop below the waist, which is too slow against fast balls."], "c": "After each shot, check whether your teammate is back in ready position before the opponent contacts the ball."}, {"k": "serve", "n": "Serve", "p": "Deliver the ball consistently and deep into the diagonal service court so the receiver cannot attack the return.", "kk": ["Volley serve: swing from low to high, contact below the waist, and keep the paddle head below the wrist at contact.", "Drop serve: let the ball fall naturally (no toss or push), let it bounce, then hit with any motion.", "Aim near the opponent's baseline. Depth matters more than speed.", "Neither foot may touch the baseline or the court at contact."], "e": ["A side-spin sweeping serve with the paddle head above the wrist violates the volley serve rule.", "Chasing speed and missing the serve; every point matters for the serving team."], "c": "Have your teammate serve 10 balls and record how many land in the back half of the service court."}, {"k": "return", "n": "Return of serve", "p": "Hit a deep, high return to buy yourself time to move up to the kitchen line.", "kk": ["Stand near the baseline and let the serve bounce (two-bounce rule).", "Aim deep toward the opponent's baseline, with a slightly higher arc.", "Move forward to the kitchen line immediately after contact."], "e": ["Staying at the baseline after returning, giving up the chance to take the net.", "Returning too short, which hands the serving team an easy attack."], "c": "Watch your teammate's first step after contact: forward, or stuck in place?"}, {"k": "dink", "n": "Dink", "p": "Soft shots at the kitchen line that land in the opponent's kitchen and force them to hit upward.", "kk": ["Push from the shoulder like a pendulum; do not flick the wrist.", "Bend the knees to lower your body and open the paddle face slightly.", "Clear the net by only a little, landing inside the opponent's kitchen.", "Target their feet or the cross-court angle."], "e": ["Flicking with the wrist, which is inconsistent and floats the ball high enough to be attacked.", "Standing upright and reaching with the arm only."], "c": "Count how many dinks in a row your teammate keeps inside the kitchen without error."}, {"k": "drop", "n": "Third shot drop", "p": "The serving team's third shot: a soft arc into the opponent's kitchen that buys time for both partners to come to the net.", "kk": ["Push gently from low to high near the baseline, with contact in front of the body.", "The apex is on your own side, so the ball descends as it crosses the net into the kitchen.", "Move forward in stages after contact: advance, split-step, advance again. Do not sprint to the net."], "e": ["Hitting flat and high, letting the opponent at the net volley it aggressively.", "Advancing too fast and getting the ball played at your feet."], "c": "Out of 10 third shots, record how many force the opponent to let the ball bounce."}, {"k": "drive", "n": "Drive", "p": "A firm flat or topspin shot used to pressure opponents or force a weak reply.", "kk": ["Turn the shoulders and brush from low to high, adding topspin so the ball dips.", "Contact in front of the body at about waist height.", "Best used when opponents are still in the backcourt, or when the ball sits up."], "e": ["Using the arm alone without rotation, which is weak and often long.", "Driving from a poor position, giving the opponent an easy volley."], "c": "Ask your teammate to explain why they chose a drive rather than a drop on that ball."}, {"k": "volley", "n": "Volley", "p": "Hitting the ball out of the air to cut the opponent's reaction time. Only legal outside the kitchen.", "kk": ["Keep the paddle in front of the body and the motion small, more of a block or push than a swing.", "Punch downward on high balls; block low balls back softly.", "Stay balanced after contact so momentum does not carry you into the kitchen."], "e": ["Taking a full swing, which is too slow against fast balls.", "Leaning forward after the volley and stepping into the kitchen, which is a fault."], "c": "Watch your teammate's feet during volleys: do they stay behind the kitchen line throughout?"}, {"k": "lob", "n": "Lob", "p": "A high ball over the opponent at the net, forcing them back and breaking the kitchen-line stalemate.", "kk": ["Use a preparation similar to the dink so the opponent cannot read it.", "Hit high enough to clear their reach, landing near the baseline.", "Prepare to defend the overhead that may follow."], "e": ["Not hitting it high enough, which invites a smash.", "Lobbing too often, which removes the element of surprise."], "c": "Record how often the lob successfully pushes the opponents back."}, {"k": "smash", "n": "Overhead smash", "p": "Punishing a ball that sits too high, hitting down at a steep angle to win the point.", "kk": ["Turn sideways and point at the ball with the non-paddle hand to track it.", "Contact above and in front of the head, hitting downward.", "Target their feet or the gap between the two opponents."], "e": ["Backpedalling while facing the ball, which risks losing balance and falling.", "Swinging while square to the net, which costs both angle and power."], "c": "Check whether your teammate moves back sideways rather than backpedalling."}, {"k": "reset", "n": "Reset", "p": "Under attack, absorb the pace and drop the ball softly back into the opponent's kitchen to neutralise the rally.", "kk": ["Loosen the grip so the paddle face absorbs the speed.", "Open the face slightly and keep the motion minimal.", "The goal is to land the ball in the kitchen, not to win the point."], "e": ["Trying to counter-attack, which produces errors.", "Gripping too tightly, which pops the ball up."], "c": "During a sustained attack, count your teammate's successful resets."}], "phases": [{"t": "Serve", "d": "The server serves from behind the baseline in the right service court, diagonally into the opponent's court. Both members of the serving team stay back, because the two-bounce rule requires the third shot to bounce. The receiver's partner can already stand at the kitchen line.", "q": "Why can the server's partner not move to the net straight away? What would happen if they did?"}, {"t": "Return of serve", "d": "The receiver lets the ball bounce, returns deep to the serving team's baseline, and moves forward immediately to join their partner at the kitchen line. The receiving team now holds the stronger position.", "q": "Should the return be deep or fast? Which one gives you more time to reach the net?"}, {"t": "Third shot drop", "d": "The serving team drops the third shot softly into the opponent's kitchen. The opponents must let it bounce and hit upward, which gives the serving team time to advance into the transition zone.", "q": "If your third shot is too high, what will the opponent at the net do? How should you adjust?"}, {"t": "Kitchen line stalemate", "d": "All four players are at the kitchen line, exchanging dinks. This is a contest of patience: whoever lifts the ball first gives the other team the chance to attack.", "q": "During a dink exchange, where do you aim? Down the line, cross-court, or at the middle? What does each one gain?"}, {"t": "Attacking window", "d": "When the opponent's ball rises above net height, that is the moment to volley downward. Attack the gap between the two opponents or the foot on their paddle side. If the ball is below net height, keep dinking or reset instead of forcing the attack.", "q": "How do you decide whether a ball is attackable or should be dinked again? Name the cues you use."}], "scen": [{"q": "Opponents keep returning deep to our baseline and we cannot get to the net.", "a": "First work out whether it is the quality of the third shot or the movement. Practise a higher-arc drop when pushed deep, and advance in stages: move a few steps after each shot, split-step as the opponent contacts the ball, then continue."}, {"q": "We always make the first error in dink exchanges.", "a": "Check three things: whether the knees are bent, whether the wrist is flicking, and whether the target is too close to the net. Start by aiming for the middle of the kitchen, then work on angles once that is reliable."}, {"q": "One opponent is much stronger than the other. How should we play?", "a": "Direct most balls to the weaker side, but watch for the stronger player shifting across to poach. Discuss: when they poach, which side of their court opens up?"}, {"q": "Both of us keep going for the same ball down the middle.", "a": "Agree a rule in advance, such as the player whose forehand is in the middle takes it, or whoever has the better angle from the diagonal. Say it out loud as one sentence before the match."}, {"q": "Opponents lob us constantly and keep pushing us back.", "a": "Watch their preparation before the lob and take half a step back early; do not stand right on the kitchen line. Also discuss whether our own dinks are too easy to lob, for instance too high or too central."}], "rules": [{"t": "The serve", "a": "The serve must travel diagonally into the opponent's service court and clear the kitchen (landing on the kitchen line is a fault). A volley serve requires an upward swing, contact below the waist and the paddle head below the wrist; a drop serve lets the ball fall naturally and be struck after the bounce. Each server gets one attempt, and a serve that clips the net and lands correctly is played on."}, {"t": "Two-bounce rule", "a": "After the serve, the receiving team must let the ball bounce before returning it, and the serving team must then let the return bounce as well. Only after those two bounces may either team volley."}, {"t": "Kitchen (non-volley zone)", "a": "You may not volley while standing in the kitchen or touching its line. If your momentum carries you into the kitchen after a volley, it is a fault even once the ball is dead. Once a ball has bounced, you may enter the kitchen to play it at any time."}, {"t": "Scoring (side-out)", "a": "Only the serving team can score. Games are usually to 11, win by 2. The doubles call has three numbers: serving team's score, receiving team's score, and server number (1 or 2). Each game starts at 0-0-2, because the first serving team has only one server. Some events use rally scoring instead, so follow the event's format."}, {"t": "Changing server", "a": "When the serving team wins a rally, the server and partner switch sides and the same player serves again. When they lose a rally, the partner serves (second server). Once both have lost a rally it is a side out, and the opposing player then in the right service court serves first."}, {"t": "Common faults", "a": "Ball out of bounds, failing to clear the net, breaking the two-bounce rule, volleying in the kitchen, the ball hitting a player or their clothing, touching the net or post while the ball is live, and foot faults on the serve. A ball touching any line is in, except a serve landing on the kitchen line."}, {"t": "Line calls and self-officiating", "a": "In practice and recreational play, each team calls the lines on its own side. If you cannot call a ball out immediately and with certainty, it is in, and the benefit of the doubt goes to your opponent."}], "quiz": [{"q": "The serve lands on the opponent's kitchen line.", "a": false, "e": "The kitchen line is part of the kitchen, so a serve landing on it is a fault."}, {"q": "The serve clips the net and lands in the correct service court; play continues.", "a": true, "e": "Let serves were removed from the rules. If it lands in the correct court, it is good."}, {"q": "After the return, the serving team volleys the ball before it bounces.", "a": false, "e": "This breaks the two-bounce rule: the serving team's third shot must also bounce first."}, {"q": "A player volleys from outside the kitchen, and momentum then carries a foot into the kitchen.", "a": false, "e": "Momentum from the volleying motion carrying you into the kitchen is a fault, even after the ball is dead."}, {"q": "The ball bounces in the kitchen and the player steps in to play it.", "a": true, "e": "Once the ball has bounced it is not a volley, so entering the kitchen is legal."}, {"q": "The ball lands on the baseline.", "a": true, "e": "A ball touching a line is in, with the serve on the kitchen line as the only exception."}, {"q": "The receiving team wins the rally, so the receiving team scores a point.", "a": false, "e": "In the standard format only the serving team can score. Winning the rally leads to a second server or a side out."}, {"q": "The ball strikes a player's arm, rebounds over the net and lands in the opponent's court.", "a": false, "e": "A ball hitting a player's body or clothing is a fault against that player (the paddle hand below the wrist counts as part of the paddle)."}, {"q": "At the moment of contact on the serve, the server's foot is touching the baseline.", "a": false, "e": "Neither foot may touch the baseline or the court at contact, so this is a service fault."}], "roles": [{"n": "Team coach", "d": "Lead the warm-up and technique practice, and give feedback using the peer observation prompts in the Skills module.", "c": ["Confirm which stroke the team is working on this week", "Lead a 10-minute team practice", "Record one improvement and one area to work on for each teammate"]}, {"n": "Captain", "d": "Coordinate duties and match line-ups, and settle disagreements within the team.", "c": ["Set this week's playing pairs", "Check that everyone has a duty", "Lead a discussion of one tactical scenario after the match"]}, {"n": "Referee", "d": "Apply the rules: kitchen violations, service faults and line calls.", "c": ["Complete the rule scenarios before class", "State the reason for each fault clearly during play", "Review any disputed call with both teams afterwards"]}, {"n": "Scorekeeper", "d": "Call the score aloud before every serve and record the result.", "c": ["Use the score simulator to practise the three-number call", "Call the score before every serve", "Pass the final score to the statistician"]}, {"n": "Statistician", "d": "Record team data such as serve success rate, third shot placement and error types.", "c": ["Prepare this week's recording sheet", "Record data for at least one match", "Report one finding back to the team"]}, {"n": "Equipment & safety", "d": "Responsible for the court, equipment and warm-up safety.", "c": ["Check net height and court before class", "Count paddles and balls, replace cracked balls", "Confirm the team has completed the warm-up"]}], "diag": {"grip": "<svg viewBox=\"0 0 600 250\" class=\"dg\" role=\"img\" aria-label=\"grip\"><defs><marker id=\"arw\" markerWidth=\"8\" markerHe function ytid(u){const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:null}
function vcard(title,url){
  const id=ytid(url);
  const kind=url.includes('/playlist')?'PLAYLIST':url.includes('/results')?'SEARCH':url.includes('/shorts/')?'SHORTS':'YOUTUBE';
  const img=id?`<img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
  return `<a class="vidcard" href="${url}" target="_blank" rel="noopener">
    <span class="thumb">${img}<span class="pl"><span>${PLAY}</span></span></span>
    <span class="cap">${esc(title)}<i>${kind}</i></span></a>`;
}

function chrome(id,inner){

  return `<div class="panel on" id="pg-${id}">${back}<section>${inner}</section>${pn}</div>`;
}

    <div class="eqgrid">${T.eq.map(e=>`<div class="eq glass rv"><h3>${esc(e.t)}</h3><p>${e.p}</p>
      <dl>${e.d.map(d=>`<dt>${esc(d[0])}</dt><dd>${esc(d[1])}</dd>`).join('')}</dl></div>`).join('')}</div>`;
  return chrome('gear',shead(g)+`<div class="courtbox rv">${court}${info}</div>`+eq);
}

function viewTactics(){

      <svg viewBox="-24 -34 248 508" role="img" aria-label="doubles positioning">
        <rect x="0" y="0" width="200" height="440" rx="3" fill="#14202F"/>
        <rect x="0" y="150" width="200" height="140" fill="rgba(59,123,255,.22)"/>
        <g stroke="rgba(240,245,250,.5)" stroke-width="1.4" fill="none">
          <rect x="0" y="0" width="200" height="440" rx="3"/>
          <line x1="0" y1="150" x2="200" y2="150"/><line x1="0" y1="290" x2="200" y2="290"/>
          <line x1="100" y1="0" x2="100" y2="150"/><line x1="100" y1="290" x2="100" y2="440"/>
        </g>
        <line x1="-10" y1="220" x2="210" y2="220" stroke="#2DD4E8" stroke-width="3" opacity=".9"/>
        <path id="ballpath" d="" fill="none" stroke="#2DD4E8" stroke-width="2" stroke-dasharray="5 5" opacity=".85"/>
        <g id="players"></g>

    <div class="shead rv" style="margin-top:56px"><h2>${esc(L.scenH2)}</h2><p>${esc(L.scenP)}</p></div>

}
function initTactics(){
  const pg=document.getElementById('players');
  const colors={R:'#8B7BFF',S:'#2DD4E8'};
  pg.innerHTML=Object.keys(POS[0]).map(id=>
    `<g class="player" id="p${id}"><circle r="13" fill="${colors[id[0]]}" opacity=".9"/>
     <circle r="17" fill="none" stroke="${colors[id[0]]}" stroke-width="1" opacity=".35"/>
     <text text-anchor="middle" dy="4.5" font-size="11" font-weight="700" font-family="Space Grotesk, sans-serif" fill="#05070D">${id}</text></g>`).join('');

  [...se.children].forEach((b,i)=>b.addEventListener('click',()=>setPhase(i)));
  setPhase(curPhase);
}
function setPhase(i){
  curPhase=i;
  const p=T.phases[i], L=T.tacticsLabels;
  Object.entries(POS[i]).forEach(([id,[x,y]])=>{const el=document.getElementById('p'+id); if(el) el.style.transform=`translate(${x}px,${y}px)`});
  const bp=document.getElementById('ballpath'); if(bp) bp.setAttribute('d',BALLS[i]);
  const se=document.getElementById('steps'); if(se)[...se.children].forEach((b,j)=>b.setAttribute('aria-pressed',i===j));
  document.getElementById('phase').innerHTML=`<h3>${esc(p.t)}</h3><p>${esc(p.d)}</p>
    <div class="think"><b>${esc(L.think)}</b><span>${esc(p.q)}</span></div>
    <p class="hint">${i<T.phases.length-1?`<button class="nextph" style="font:inherit;font-size:15px;border:0;background:none;color:var(--cyan);cursor:pointer;padding:0">${esc(L.nextPhase+T.phases[i+1].t)} →</button>`:esc(L.legendEnd)}</p>`;
  const nx=document.querySelector('.nextph'); if(nx) nx.addEventListener('click',()=>setPhase(i+1));
}

/* ---------- RULES ---------- */
let S,hist,qi=0,correct=0,answered={};
function viewRules(){
  const L=T.rulesLabels;
  const inner=shead(T.rulesHead)
   +`<div class="rv">${T.rules.map(r=>`<details><summary>${esc(r.t)}</summary><div>${esc(r.a)}</div></details>`).join('')}</div>
     <div class="shead rv" style="margin-top:56px"><h2>${esc(L.h2b)}</h2><p>${esc(L.pb)}</p></div>
     <div class="rulegrid"><div class="score rv" id="score"></div><div class="quiz glass rv" id="quiz"></div></div>
     <div class="links glass rv"><h3>${esc(L.linksH)}</h3><ul>${T.links.map(l=>
       `<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a>${l[2]?'：'+esc(l[2]):''}</li>`).join('')}</ul></div>`;
  return chrome('rules',inner);
}
function newGame(){S={score:[0,0],serving:0,num:2,pos:[{r:'A1',l:'A2'},{r:'B1',l:'B2'}],server:'A1',over:false,msg:T.rulesLabels.start};hist=[]}
function rally(win){
  if(S.over)return; hist.push(JSON.stringify(S));
  const L=T.rulesLabels, t=S.serving;
  if(win){
    S.score[t]++; const p=S.pos[t]; [p.r,p.l]=[p.l,p.r];
    S.msg=LANG==='zh'?`發球方得分，${S.server} 換到另一側繼續發球。`:`Point for the serving team. ${S.server} switches sides and serves again.`;
    if(S.score[t]>=11&&S.score[t]-S.score[1-t]>=2){S.over=true;
      S.msg=LANG==='zh'?`${t===0?'A 隊':'B 隊'}以 ${S.score[t]}:${S.score[1-t]} 獲勝。`:`${t===0?'Team A':'Team B'} wins ${S.score[t]}–${S.score[1-t]}.`}
  }else if(S.num===1){
    const p=S.pos[t]; S.server=(p.r===S.server)?p.l:p.r; S.num=2;
    S.msg=LANG==='zh'?`發球方失分，換第二發球員 ${S.server}，位置不變。`:`Rally lost. Second server ${S.server} now serves; positions stay.`;
  }else{
    S.serving=1-t; S.num=1; S.server=S.pos[S.serving].r;
    S.msg=LANG==='zh'?`換發（side out），由${S.serving===0?'A 隊':'B 隊'}右側的 ${S.server} 發球。`:`Side out. ${S.server}, in the right court for ${S.serving===0?'Team A':'Team B'}, serves.`;
  }
  renderScore();
}
function renderScore(){
  const L=T.rulesLabels, t=S.serving, o=1-t, side=S.pos[t].r===S.server?L.right:L.left;
  const team=i=>`<div class="team ${i===t?'serve':''}"><div class="tn">${esc(i===0?L.teamA:L.teamB)}</div>
    <div class="n">${S.score[i]}</div><div class="pp">${esc(L.right)} ${S.pos[i].r} · ${esc(L.left)} ${S.pos[i].l}</div></div>`;
  document.getElementById('score').innerHTML=`<div class="lbl">${esc(L.call)}</div>
    <div class="call">${S.score[t]}-${S.score[o]}-${S.num}</div>
    <div class="who">${S.over?esc(L.over):esc(L.server)+' '+S.server+'（'+esc(side+L.svcArea)+'）'}</div>
    <div class="teams">${team(0)}${team(1)}</div>
    <div class="btns"><button class="b-win" data-a="w" ${S.over?'disabled':''}>${esc(L.winBtn)}</button>
    <button class="b-lose" data-a="l" ${S.over?'disabled':''}>${esc(L.loseBtn)}</button>
    <button class="b-ghost" data-a="u">${esc(L.undo)}</button><button class="b-ghost" data-a="n">${esc(L.newGame)}</button></div>
    <div class="log">${esc(S.msg)}</div>`;
  document.querySelectorAll('#score button').forEach(b=>b.addEventListener('click',()=>{
    const a=b.dataset.a;
    if(a==='w')rally(true); else if(a==='l')rally(false);
    else if(a==='u'){if(hist.length){S=JSON.parse(hist.pop());renderScore()}}
    else {newGame();renderScore()}
  }));
}
function renderQuiz(){
  const L=T.rulesLabels, it=T.quiz[qi], ans=answered[qi];
  document.getElementById('quiz').innerHTML=`<div class="lbl">${esc(L.case)} ${String(qi+1).padStart(2,'0')} / ${T.quiz.length}</div>
    <div class="q">${esc(it.q)}</div>
    <div class="opts"><button data-v="1" ${ans!==undefined?'disabled':''}>${esc(L.legal)}</button>
    <button data-v="0" ${ans!==undefined?'disabled':''}>${esc(L.fault)}</button></div>
    <div class="fb">${ans===undefined?'':`<span class="v ${ans===it.a?'ok':'no'}">${esc(ans===it.a?L.correct:L.wrong)}</span> ${esc(it.e)}`}</div>
    <div class="qnav"><button data-n="-1" ${qi===0?'style="visibility:hidden"':''}>${esc(L.prevQ)}</button>
    <span>${esc(L.score)} ${correct} ${esc(L.scoreUnit)}</span>
    <button data-n="1" ${qi===T.quiz.length-1?'style="visibility:hidden"':''}>${esc(L.nextQ)}</button></div>`;
  document.querySelectorAll('#quiz .opts button').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.v==='1'; answered[qi]=v; if(v===it.a)correct++; renderQuiz()}));
  document.querySelectorAll('#quiz .qnav button').forEach(b=>b.addEventListener('click',()=>{qi+=+b.dataset.n;renderQuiz()}));
}

     <div class="shead rv"><h2>${esc(H.h2b)}</h2><p>${esc(H.pb)}</p></div>
     <div class="roles">${T.roles.map((r,i)=>`<div class="role glass rv"><h3>${esc(r.n)}</h3><p>${esc(r.d)}</p>
       ${r.c.map((c,j)=>`<label><input type="checkbox" data-k="${i}-${j}" ${checked[i+'-'+j]?'checked':''}><span>${esc(c)}</span></label>`).join('')}</div>`).join('')}</div>`;

function renderFooter(){
  const F=T.footer;
  document.getElementById('footer').innerHTML=`<div class="wrap"><div class="fgrid">
    <div><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#2DD4E8" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="9" r="6"/><path d="M12 15v6M9 21h6M9.5 7.5h.01M14.5 7.5h.01M12 11h.01"/></svg>PICKLE.LAB</span>
      <p>${esc(F.p)}</p></div>
    <div><h4>${esc(F.h1)}</h4><ul>${PAGES.slice(1).map(p=>`<li><button data-go="${p}">${esc(T.nav[p])}</button></li>`).join('')}</ul></div>
    <div><h4>${esc(F.h2)}</h4><ul>${T.flinks.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a></li>`).join('')}</ul></div>
    </div><div class="fbot">${esc(F.bot)}　｜　${esc(F.dev)}　<b>${esc(T.hero.creditName)}</b></div></div>`;

/* ---------- render / route ---------- */
function render(){
  const m=document.getElementById('main');
  m.innerHTML = page==='home'?viewHome(): page==='gear'?viewGear(): page==='skills'?viewSkills():
                page==='tactics'?viewTactics(): page==='rules'?viewRules(): viewSem();
  if(page==='skills') initSkills();
  if(page==='tactics') initTactics();
  if(page==='rules'){ if(!S) newGame(); renderScore(); renderQuiz(); }
  if(page==='gear') bindZones();
  if(page==='sem') document.querySelectorAll('#main .role input').forEach(cb=>cb.addEventListener('change',()=>{
    const c=store.get('pb-checks')||{}; c[cb.dataset.k]=cb.checked; store.set('pb-checks',c)}));
  renderNav(); renderFooter(); reveal(); counters();
  document.documentElement.lang = LANG==='zh'?'zh-Hant':'en';
}
function bindZones(){
  document.querySelectorAll('.zone').forEach(z=>{
    z.setAttribute('tabindex','0'); z.setAttribute('role','button');
    const go=()=>{
      document.querySelectorAll('.zone').forEach(x=>x.classList.toggle('sel',x.dataset.z===z.dataset.z));
      const d=T.zones[z.dataset.z];
      document.getElementById('zoneinfo').innerHTML=`<h3>${esc(d.t)}</h3><div class="big">${esc(d.big)}</div>${d.p.map(x=>`<p>${esc(x)}</p>`).join('')}`;
    };
    z.addEventListener('click',go);
    z.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  });
}
function reveal(){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),
    {threshold:.1,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll('.rv:not(.in)').forEach((el,i)=>{el.style.transitionDelay=(i%5*60)+'ms';io.observe(el)});
}
function counters(){
  const cio=new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting)return; cio.unobserve(e.target);
    const t=+e.target.dataset.count; let n=0;
    const step=()=>{n+=Math.max(1,Math.ceil(t/22)); if(n>=t){e.target.textContent=t;return} e.target.textContent=n; requestAnimationFrame(step)};
    step();
  }),{threshold:.6});
  document.querySelectorAll('[data-count]').forEach(el=>cio.observe(el));
}
function goPage(id,push){
  if(!PAGES.includes(id)) id='home';
  page=id; render();
  if(push&&location.hash!=='#'+id) history.pushState(null,'','#'+id);
  window.scrollTo({top:0,behavior:'auto'});
}
function setLang(l){
  if(l===LANG)return;
  LANG=l; T=DATA[l]; store.set('pb-lang',l);
  answered={}; qi=0; correct=0; S=null;
  render(); window.scrollTo({top:0,behavior:'auto'});
}
document.addEventListener('click',e=>{
  const l=e.target.closest('[data-lang]'); if(l){setLang(l.dataset.lang);return}
  const b=e.target.closest('[data-go]'); if(b){e.preventDefault();goPage(b.dataset.go,true)}
});
addEventListener('hashchange',()=>goPage(location.hash.slice(1)||'home'));

/* ambient dust */
(function(){
  const c=document.getElementById('dust'); if(!c||matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x=c.getContext('2d'); let w,h,pts;
  const resize=()=>{w=c.width=innerWidth;h=c.height=innerHeight;
    pts=Array.from({length:Math.min(46,Math.round(w/34))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.4,vy:-(Math.random()*.16+.04),o:Math.random()*.4+.12}))};
  resize(); addEventListener('resize',resize);
  (function loop(){x.clearRect(0,0,w,h);
    for(const p of pts){p.y+=p.vy; if(p.y<-6){p.y=h+6;p.x=Math.random()*w}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.284);x.fillStyle='rgba(155,200,255,'+p.o+')';x.fill()}
    requestAnimationFrame(loop)})();
})();

goPage(location.hash.slice(1)||'home');
</script>
